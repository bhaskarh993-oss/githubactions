
name: Docker Build Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker version
        run: docker --version

      - name: Build Docker image
        run: docker build -t bhaskar-nginx:v1 .

      - name: Verify Docker image
        run: docker images
